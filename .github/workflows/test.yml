name: Test XDP program compile/load/attach on Ubuntu

on: [push, pull_request]

jobs:
  xdp_test:
    runs-on: ubuntu-latest

    env:
      C_INCLUDE_PATH: /usr/include/x86_64-linux-gnu
      IFACE: lo

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up BPF toolchain
      run: |
        sudo apt-get update
        sudo apt-get install clang llvm libbpf-dev make linux-headers-$(uname -r) pkg-config libelf-dev gcc -y
        find /usr/include -name 'types.h'

    - name: Test compile XDP program
      run: make compile
    - name: Build monitor (user-space tool)
      run: |
        if [ -f monitor.c ]; then
          gcc -O2 -o monitor monitor.c $(pkg-config --cflags --libs libbpf 2>/dev/null || echo "") || true
        else
          echo "monitor.c not found, skipping"
        fi

    - name: Note about attach/detach
      run: |
        echo "Attach/detach steps are skipped in this workflow because they require a privileged or self-hosted runner."